apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: plane
  namespace: argocd
spec:
  description: GitOps management for Plane CE

  sourceRepos:
    - https://github.com/LibanIsse/plane-eks-production-deployment.git

  destinations:
    - namespace: plane
      server: https://kubernetes.default.svc

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
