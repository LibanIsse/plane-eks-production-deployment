
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.14.0
    helm:
      releaseName: metrics-server
      valuesObject:
        replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=false


---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/helm/values/external-secrets.yaml

    - repoURL: https://github.com/LibanIsse/plane-eks-production-deployment.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ClientSideApplyMigration=false


---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plane-secretstore
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/LibanIsse/plane-eks-production-deployment.git
    targetRevision: main
    path: kubernetes/external-secrets
    directory:
      include: secretsstore.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: plane

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
