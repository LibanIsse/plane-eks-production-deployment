apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-postgres
  namespace: plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: plane-postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: "rds!db-c4dfa60a-4e30-438a-ba4b-1ba30095c5b1"
        property: username
    - secretKey: password
      remoteRef:
        key: "rds!db-c4dfa60a-4e30-438a-ba4b-1ba30095c5b1"
        property: password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-rabbitmq
  namespace: plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: plane-rabbitmq-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: "plane/rabbitmq/credentials"
        property: username
    - secretKey: password
      remoteRef:
        key: "plane/rabbitmq/credentials"
        property: password

---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-app-keys
  namespace: plane
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore

  target:
    name: plane-app-keys
    creationPolicy: Owner

  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: plane/app/signing-keys
        property: SECRET_KEY

    - secretKey: LIVE_SERVER_SECRET_KEY
      remoteRef:
        key: plane/app/signing-keys
        property: LIVE_SERVER_SECRET_KEY