provider:
  name: aws

sources:
  - service
  - ingress

domainFilters:
  - eks.libancloud.co.uk

managedRecordTypes:
  - A
  - AAAA
  - CNAME
  - TXT

policy: upsert-only

registry: txt
txtOwnerId: plane-eks-production
txtPrefix: "external-dns-%{record_type}."

serviceAccount:
  create: true
  name: external-dns

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi