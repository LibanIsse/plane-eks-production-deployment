provider:
  name: aws

sources:
  - service
  - ingress

domainFilters:
  - eks.libancloud.co.uk

policy: upsert-only

registry: txt
txtOwnerId: plane-eks-production
txtPrefix: external-dns-

serviceAccount:
  create: true
  name: external-dns

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi