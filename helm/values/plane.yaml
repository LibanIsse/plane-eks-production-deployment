ingress:
  enabled: true
  appHost: "eks.libancloud.co.uk"
  ingressClass: "nginx"
  ingress_annotations:
    nginx.org/proxy-redirect-from: "http://eks.libancloud.co.uk:3000/"
    nginx.org/proxy-redirect-to: "https://eks.libancloud.co.uk/"

ssl:
  externalTermination: true
  createIssuer: false
  generateCerts: false

external_secrets:
  app_env_existingSecret: plane-app-secrets
  live_env_existingSecret: plane-live-secrets
  app_keys_existingSecret: plane-app-keys

serviceAccount:
  create: true
  name: plane-s3
  cloudIdentity: true

planeVersion: "2c9b6fa"

web:
  image: 471743301992.dkr.ecr.eu-west-2.amazonaws.com/plane/plane-web
  pullPolicy: IfNotPresent
  cpuRequest: 50m
  memoryRequest: 64Mi
  cpuLimit: 500m
  memoryLimit: 256Mi

space:
  image: 471743301992.dkr.ecr.eu-west-2.amazonaws.com/plane/plane-space
  pullPolicy: IfNotPresent
  cpuRequest: 50m
  memoryRequest: 64Mi
  cpuLimit: 500m
  memoryLimit: 256Mi

admin:
  image: 471743301992.dkr.ecr.eu-west-2.amazonaws.com/plane/plane-admin
  pullPolicy: IfNotPresent
  cpuRequest: 50m
  memoryRequest: 64Mi
  cpuLimit: 500m
  memoryLimit: 256Mi

live:
  image: 471743301992.dkr.ecr.eu-west-2.amazonaws.com/plane/plane-live
  pullPolicy: IfNotPresent
  cpuRequest: 50m
  memoryRequest: 128Mi
  cpuLimit: 500m
  memoryLimit: 512Mi

api:
  image: 471743301992.dkr.ecr.eu-west-2.amazonaws.com/plane/plane-api
  pullPolicy: IfNotPresent
  cpuRequest: 100m
  memoryRequest: 256Mi
  cpuLimit: 500m
  memoryLimit: 768Mi

worker:
  image: 471743301992.dkr.ecr.eu-west-2.amazonaws.com/plane/plane-api
  pullPolicy: IfNotPresent
  cpuRequest: 100m
  memoryRequest: 256Mi
  cpuLimit: 500m
  memoryLimit: 768Mi

beatworker:
  image: 471743301992.dkr.ecr.eu-west-2.amazonaws.com/plane/plane-api
  pullPolicy: IfNotPresent
  cpuRequest: 50m
  memoryRequest: 128Mi
  cpuLimit: 500m
  memoryLimit: 384Mi


postgres:
  local_setup: false

redis:
  local_setup: false

rabbitmq:
  local_setup: false

minio:
  local_setup: false

env:
  requireExplicitSecrets: true
  docstore_bucket: "${S3_BUCKET_NAME}"
  aws_region: "eu-west-2"