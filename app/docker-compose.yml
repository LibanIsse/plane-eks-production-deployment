services:
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - redisdata:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    networks:
      - dev_env
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    networks:
      - dev_env
    command: postgres -c 'max_connections=1000'
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data

  plane-minio:
    image: minio/minio
    restart: unless-stopped
    networks:
      - dev_env
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    ports:
      - "9000:9000"
      - "9090:9090"

  migrator:
    image: plane-api:local
    restart: "no"
    networks:
      - dev_env
    env_file:
      - apps/api/.env
    command: ./bin/docker-entrypoint-migrator.sh
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq

  api:
    image: plane-api:local
    restart: unless-stopped
    networks:
      - dev_env
    env_file:
      - apps/api/.env
    command: >
      sh -c "
      gunicorn -w ${GUNICORN_WORKERS:-2} -k uvicorn.workers.UvicornWorker plane.asgi:application --bind 0.0.0.0:8000 --max-requests 1200 --max-requests-jitter 1000 --access-logfile -
      "

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/api/instances/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
      - plane-minio
    ports:
      - "8000:8000"

  worker:
    image: plane-api:local
    restart: unless-stopped
    networks:
      - dev_env
    env_file:
      - apps/api/.env
    command: ./bin/docker-entrypoint-worker.sh
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  beat-worker:
    image: plane-api:local
    restart: unless-stopped
    networks:
      - dev_env
    env_file:
      - apps/api/.env
    command: ./bin/docker-entrypoint-beat.sh
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  web:
    image: plane-web:local
    restart: unless-stopped
    networks:
      - dev_env
    depends_on:
      - api

  admin:
    image: plane-admin:local
    restart: unless-stopped
    networks:
      - dev_env
    depends_on:
      - api

  space:
    image: plane-space:local
    restart: unless-stopped
    networks:
      - dev_env
    depends_on:
      - api

  live:
    image: plane-live:local
    restart: unless-stopped
    networks:
      - dev_env
    env_file:
      - apps/api/.env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api

  proxy:
    image: plane-proxy:local
    restart: unless-stopped
    networks:
      - dev_env
    env_file:
      - .env
    environment:
      SITE_ADDRESS: ":80"
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      CERT_EMAIL: ${CERT_EMAIL}
      CERT_ACME_DNS: ${CERT_ACME_DNS}
      CERT_ACME_CA: ${CERT_ACME_CA}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
    depends_on:
      - web
      - admin
      - space
      - live
      - api
      - plane-minio
    ports:
      - "8080:80"
      - "8443:443"

volumes:
  redisdata:
  uploads:
  pgdata:
  rabbitmq_data:

networks:
  dev_env:
    driver: bridge